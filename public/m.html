<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NexBot</title>
    <style>
      html, body { margin: 0; background: #e8eaee; color: #1d1d1f; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 18px; letter-spacing: -0.02em; }
      .bot { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px; border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; background: rgba(255,255,255,0.72); color: inherit; }
      .bot.on { border-color: rgba(0,0,0,0.35); }
      textarea, button.send { width: 100%; box-sizing: border-box; }
      textarea { margin-top: 12px; min-height: 88px; padding: 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: #fff; color: inherit; }
      button.send { margin-top: 10px; padding: 12px; border: 0; border-radius: 999px; background: #1d1d1f; color: #f5f5f7; font-weight: 600; }
      a { color: #5c6570; }
      .meta { color: rgba(29,29,31,0.55); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>NexBot</h1>
      <p class="meta">Assign a job on this PC. Needs the signed token from App Settings.</p>
      <div id="list"></div>
      <textarea id="text" placeholder="What should they do?"></textarea>
      <button class="send" id="go">Send</button>
      <p class="meta" id="status"></p>
      <p class="meta"><a id="watch" href="/watch.html">Watch screen</a></p>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token") || "";
      let bots = [];
      let selected = new Set();
      const list = document.getElementById("list");
      const status = document.getElementById("status");
      if (!token) status.textContent = "Open this page from App Settings → Phone and chat (signed link).";
      fetch("/api/bots").then((r) => r.json()).then((d) => {
        bots = (d.bots || []).filter((b) => b.kind !== "group" && !b.hidden);
        list.innerHTML = "";
        bots.forEach((b) => {
          const btn = document.createElement("button");
          btn.className = "bot";
          btn.textContent = b.name + (b.busy ? " · working" : "");
          btn.onclick = () => {
            if (selected.has(b.id)) selected.delete(b.id);
            else selected.add(b.id);
            btn.classList.toggle("on", selected.has(b.id));
          };
          list.appendChild(btn);
        });
      }).catch(() => { status.textContent = "Cannot reach the harness."; });
      document.getElementById("go").onclick = async () => {
        const text = document.getElementById("text").value.trim();
        const ids = [...selected];
        if (!token) { status.textContent = "Missing token. Use the signed link."; return; }
        if (!text || !ids.length) { status.textContent = "Pick at least one bot and write a job."; return; }
        const res = await fetch("/api/steer/jobs?token=" + encodeURIComponent(token), {
          method: "POST",
          headers: { "content-type": "application/json", authorization: "Bearer " + token },
          body: JSON.stringify({ text, botIds: ids }),
        });
        const body = await res.json().catch(() => ({}));
        status.textContent = res.ok ? "Sent to " + (body.started || []).length + " bot(s)." : (body.error || "failed");
        document.getElementById("watch").href = "/watch.html?bot=" + (ids[0] || "");
      };
    </script>
  </body>
</html>
